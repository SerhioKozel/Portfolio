junit.jupiter.extensions.autodetection.enabled=true
# Параллельный запуск: классы выполняются одновременно, методы внутри класса — по очереди.
# Тесты не делят изменяемое состояние (см. проверку: в main нет изменяемых static-полей,
# каждый тест пишет в собственный @TempDir, samples/ только читаются).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
